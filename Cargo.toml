[package]
name = "pump-sentry"
description = "Paper-trading Solana memecoin sniper: Pump.fun launch screening, fail-closed risk gates, and Jito-routed live execution"
version = "0.10.3"
edition = "2024"
readme = "README.md"
rust-version = "1.99.0"
publish = false
repository = "https://github.com/sembraniteam/pump-sentry"
authors = ["Ahmad Rifa'i <develop.rifai@gmail.com>"]

[workspace]
members = ["crates/*"]
resolver = "2"

[patch.crates-io]
solana-pubsub-client = { path = "vendor/solana-pubsub-client" }

[workspace.lints.rust]
unused_qualifications = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
incremental = false

[dependencies]
listener = { path = "crates/listener" }
auditor = { path = "crates/auditor" }
risk_engine = { package = "risk-engine", path = "crates/risk-engine" }
simulator = { path = "crates/simulator" }
curve = { path = "crates/curve" }
executor = { path = "crates/executor" }
ids = { path = "crates/ids" }
migration = { path = "crates/migration" }
alert = { path = "crates/alert" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "builder",
    "native_tls_backend",
] }
libc = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Single explicit TLS crypto provider: the tree enables both `ring`
# (via quinn/Solana) and `aws-lc-rs` (via reqwest), so rustls cannot
# auto-select a process default and panics on first TLS use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
toml = "1.1.8"
zeroize = "1"
solana-client = "4.3.0"
solana-pubkey = "4.4"
url = "2"
solana-commitment-config = "3.1"

[dev-dependencies]
tempfile = "3"
solana-keypair = "3.1"
solana-commitment-config = "3.1"
bs58 = "0.5"

[lints]
workspace = true

[[test]]
name = "second_run_refuses_to_start_while_state_dir_is_owned"
path = "tests/state_lock_single_owner.rs"