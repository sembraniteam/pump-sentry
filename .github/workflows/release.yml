name: release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Cargo audit binary
        id: cache-audit
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
          path: ~/.cargo/bin/cargo-audit

      - name: Install Cargo audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Run security audit
        run: |
          cargo audit --version
          cargo audit --deny warnings

  clippy:
    name: Clippy & format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clippy & Rustfmt component
        run: |
          rustup component add clippy
          rustup component add rustfmt

      - name: Show Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git

      - name: Clippy workspace all targets, warnings deny
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test workspace
    needs: [audit, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git

      - name: Run workspace tests
        run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pump-sentry-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pump-sentry-linux-arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: pump-sentry-darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: pump-sentry-darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure Rust target installed
        run: rustup target add ${{ matrix.target }}

      - name: Show Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack asset + checksum
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/pump-sentry"
          [ -x "$BIN" ] || { echo "binary missing: $BIN" >&2; exit 1; }
          mkdir -p dist
          cp "$BIN" dist/pump-sentry
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist pump-sentry
          rm dist/pump-sentry
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
          fi
          cat "dist/${{ matrix.asset }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify asset checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && for f in *.sha256; do sha256sum -c "$f"; done)

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
