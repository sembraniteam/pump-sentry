name: release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install Clippy component
        run: rustup component add clippy

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Clippy workspace all targets, warnings deny
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test workspace
    needs: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Run workspace tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pump-sentry-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pump-sentry-linux-arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: pump-sentry-darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: pump-sentry-darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Rust target installed
        run: rustup target add ${{ matrix.target }}

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack asset + checksum
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/pump-sentry"
          [ -x "$BIN" ] || { echo "binary missing: $BIN" >&2; exit 1; }
          mkdir -p dist
          cp "$BIN" dist/pump-sentry
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist pump-sentry
          rm dist/pump-sentry
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
          fi
          cat "dist/${{ matrix.asset }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true