name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: clippy all targets, warnings deny
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test workspace
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: test workspace
        run: cargo test --workspace

  build:
    name: build (${{ matrix.asset }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pump-sentry-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pump-sentry-linux-arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: pump-sentry-darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: pump-sentry-darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: pack asset + checksum
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/pump-sentry"
          [ -x "$BIN" ] || { echo "binary missing: $BIN" >&2; exit 1; }
          mkdir -p dist
          cp "$BIN" dist/pump-sentry
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist pump-sentry
          rm dist/pump-sentry
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
          fi
          cat "dist/${{ matrix.asset }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
