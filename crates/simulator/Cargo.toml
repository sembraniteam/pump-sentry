[package]
name = "simulator"
version = "0.7.0"
edition = "2024"
rust-version = "1.99.0"
description = "Paper-trading simulator: virtual balances, position tracking, PnL"
license = "MIT"
readme = "README.md"

[lib]
name = "simulator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
