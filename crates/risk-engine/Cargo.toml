[package]
name = "risk-engine"
version = "0.5.0"
edition = "2024"
rust-version = "1.99.0"
description = "LLM-driven TP/SL risk engine with deterministic 300ms-timeout heuristic fallback"
license = "MIT"
readme = "README.md"

[lib]
name = "risk_engine"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
