[package]
name = "executor"
version = "0.4.6"
edition = "2024"
rust-version = "1.99.0"
description = "Live Pump.fun buy/sell executor with wallet guards"
license = "MIT"
readme = "README.md"

[lib]
name = "executor"
path = "src/lib.rs"

[dependencies]
solana-client = "4.3"
solana-commitment-config = "3.1"
solana-hash = "4.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-pubkey = "4.4"
solana-signature = "3"
solana-signer = "3.0"
solana-transaction = "4.3"
solana-transaction-status = { version = "4.3.0", features = ["agave-unstable-api"] }
ids = { path = "../ids" }
curve = { path = "../curve" }
migration = { path = "../migration" }
spl-token = { version = "9", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8", default-features = false, features = ["no-entrypoint"] }
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
base64 = "0.23"
bincode = "1"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"
url = "2"
zeroize = "1"

[dev-dependencies]
listener = { path = "../listener" }
migration = { path = "../migration" }
solana-message = "4"
solana-rpc-client-api = "4.3.0"
solana-instruction-error = "2"
tokio = { version = "1", features = ["full"] }
