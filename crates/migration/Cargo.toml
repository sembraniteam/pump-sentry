[package]
name = "migration"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Pump.fun graduation and Raydium migration detector"
license = "MIT"
readme = "README.md"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
solana-pubkey = "4"
solana-account = "4"
solana-client = "4.3.0"
solana-commitment-config = "3"
curve = { path = "../curve" }
ids = { path = "../ids" }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Frozen mainnet pool fixtures (offset pinning).
serde_json = "1"
