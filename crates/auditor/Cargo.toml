[package]
name = "auditor"
version = "0.5.0"
edition = "2024"
rust-version = "1.99.0"
description = "RugCheck.xyz token risk evaluation client"
license = "MIT"
readme = "README.md"

[lib]
name = "auditor"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
