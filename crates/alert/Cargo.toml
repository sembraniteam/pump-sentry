[package]
name = "alert"
version = "0.10.3"
edition = "2024"
rust-version = "1.99.0"
description = "Non-blocking Discord trade alerts (bot token HTTPS)"
license = "MIT"
readme = "README.md"

[lib]
name = "alert"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
