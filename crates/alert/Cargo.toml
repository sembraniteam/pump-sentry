[package]
name = "alert"
version = "0.4.2"
edition = "2024"
rust-version = "1.99.0"
description = "Non-blocking Discord trade alerts via Hermes CLI"
license = "MIT"
readme = "README.md"

[lib]
name = "alert"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["process", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
