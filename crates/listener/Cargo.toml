[package]
name = "listener"
version = "0.10.0"
edition = "2024"
rust-version = "1.99.0"
description = "Pump.fun new-token event listener via WebSocket RPC logsSubscribe"
license = "MIT"
readme = "README.md"

[lib]
name = "listener"
path = "src/lib.rs"

[dependencies]
solana-sdk = "5.0.0"
solana-client = "4.3.0"
solana-commitment-config = "3"
solana-account-decoder = "4.3.0"
solana-transaction-status = { version = "4.3.0", features = ["agave-unstable-api"] }
migration = { path = "../migration" }
curve = { path = "../curve" }
ids = { path = "../ids" }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
base64 = "0.23.1"
thiserror = "2"
tracing = "0.1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct dep for one call: TLS on the gRPC channel (native roots).
# Version pinned to yellowstone-grpc-client's tonic; the feature is
# unified from there, stated here so the requirement is explicit.
tonic = { version = "0.14", features = ["tls-native-roots"] }
yellowstone-grpc-client = "15.0.0"
yellowstone-grpc-proto = "14.0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same dual-provider rationale as the root binary (watch opens WSS).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# MessageHeader for screen unit tests (fabricated transactions).
solana-message = "4"
# `TransactionVersion` asserts on the frozen v0/v1 envelope fixtures.
# Majors are architecture: 4.3 matches `solana-transaction-status` 4.3,
# not sdk-5's 5.1 (which must stay out of fixture typing).
solana-transaction = "4.3"

[[example]]
name = "watch"
path = "examples/watch.rs"

[lints]
workspace = true
