[package]
name = "listener"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Pump.fun new-token event listener via WebSocket RPC logsSubscribe"
license = "MIT"
readme = "README.md"

[lib]
name = "listener"
path = "src/lib.rs"

[dependencies]
solana-sdk = "5.0.0"
solana-client = "4.3.0"
solana-commitment-config = "3"
solana-account-decoder = "4.3.0"
solana-transaction-status = { version = "4.3.0", features = ["agave-unstable-api"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
base64 = "0.23.1"
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same dual-provider rationale as the root binary (watch opens WSS).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[example]]
name = "watch"
path = "examples/watch.rs"
