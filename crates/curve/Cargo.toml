[package]
name = "curve"
version = "0.10.1"
edition = "2024"
rust-version = "1.99.0"
description = "Pump.fun bonding-curve reserve reader and price ticker"
license = "MIT"
readme = "README.md"

[lib]
name = "curve"
path = "src/lib.rs"

[dependencies]
solana-sdk = "5.0.0"
solana-client = "4.3.0"
solana-commitment-config = "3"
solana-account = "4"
futures-util = "0.3"
ids = { path = "../ids" }
tokio = { version = "1", features = ["time", "sync"] }
thiserror = "2"
tracing = "0.1"
url = "2"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
