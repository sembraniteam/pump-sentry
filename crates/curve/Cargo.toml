[package]
name = "curve"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Pump.fun bonding-curve reserve reader and price ticker"
license = "MIT"
readme = "README.md"

[lib]
name = "curve"
path = "src/lib.rs"

[dependencies]
solana-sdk = "5.0.0"
solana-client = "4.3.0"
solana-commitment-config = "3"
solana-account = "4"
tokio = { version = "1", features = ["time", "sync"] }
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
